<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the web manifest's icons, so the home-screen icon has to be
         declared here or Safari falls back to a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b4f" />
    <!-- iOS labels the home-screen icon from <title> unless told otherwise; it
         does not read the manifest's short_name. -->
    <meta name="apple-mobile-web-app-title" content="Albion" />
    <title>Albion Adventure Land</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
